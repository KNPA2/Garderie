<section class="list">
  <header class="list-header">
    <h2>{{ heading }}</h2>
  </header>
  @if (items.length === 0) {
    <p class="list-empty">Aucun élément à afficher.</p>
  }
  <ul class="list-items">
    @for (item of items; track item.id) {
      <li>
        @if (item.route) {
          <a [routerLink]="item.route">{{ item.title }}</a>
        } @else {
          <span>{{ item.title }}</span>
        }
        @if (item.hint) {
          <small>{{ item.hint }}</small>
        }
      </li>
    }
  </ul>
</section>
